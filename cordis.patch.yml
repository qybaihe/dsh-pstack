# The layer a profile gets when it installs this bundle. Each row is one
# plugin that Plugins can turn on or off by itself. To change a row's config,
# restate the row by id in your profile's own cordis.patch.yml.

- insert:
    - id: pstack
      name: '@qybaihe/dsh-pstack'

    - id: pstack-skills
      name: '@qybaihe/dsh-pstack/skills'

    - id: pstack-guard
      name: '@qybaihe/dsh-pstack/guard'

    - id: pstack-playbook
      name: '@qybaihe/dsh-pstack/playbook'

    - id: pstack-tdd
      name: '@qybaihe/dsh-pstack/tdd'

    - id: pstack-ledger
      name: '@qybaihe/dsh-pstack/ledger'

    - id: pstack-panel
      name: '@qybaihe/dsh-pstack/panel'

    - id: pstack-bench
      name: '@qybaihe/dsh-pstack/bench'

    - id: pstack-autopilot
      name: '@qybaihe/dsh-pstack/autopilot'
